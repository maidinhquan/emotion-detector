<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Emotion Detector</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 3rem auto;
        max-width: 42rem;
        padding: 0 1rem;
      }
      textarea {
        box-sizing: border-box;
        display: block;
        margin: 0.75rem 0;
        min-height: 8rem;
        padding: 0.75rem;
        width: 100%;
      }
      button {
        padding: 0.6rem 1rem;
      }
      #result {
        margin-top: 1.5rem;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Emotion Detector</h1>
      <label for="text-to-analyze">Enter text to analyze</label>
      <textarea id="text-to-analyze" placeholder="Type a sentence..."></textarea>
      <button id="analyze" type="button">Analyze emotion</button>
      <p id="result" role="status" aria-live="polite"></p>
    </main>
    <script>
      const input = document.getElementById("text-to-analyze");
      const result = document.getElementById("result");
      document.getElementById("analyze").addEventListener("click", async () => {
        const text = input.value.trim();
        if (!text) {
          result.textContent = "Invalid text! Please try again!";
          return;
        }

        result.textContent = "Analyzing...";
        try {
          const response = await fetch(
            `/emotionDetector?textToAnalyze=${encodeURIComponent(text)}`
          );
          result.textContent = await response.text();
        } catch (error) {
          result.textContent = "Unable to analyze the text right now.";
        }
      });
    </script>
  </body>
</html>
